
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס יצירת קשר</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; direction: rtl; }
        .form-container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>טופס יצירת קשר</h2>
    <form action="https://api.web3forms.com/submit" method="POST">
        
        <!-- Access Key מאומת -->
        <input type="hidden" name="access_key" value="a6fc9942-f2e2-4415-9f2a-99a8bde5db1a">

        <div class="form-group">
            <label for="name">שם מלא:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">דואר אלקטרוני:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">טלפון:</label>
            <input type="tel" id="phone" name="phone">
        </div>

        <div class="form-group">
            <label for="message">הודעה / פרטים נוספים:</label>
            <textarea id="message" name="message" rows="4"></textarea>
        </div>

        <button type="submit">שלח טופס</button>
    </form>
</div>

</body>
</html>
