<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>השארת פרטים - יצחק חלימי, ייעוץ משכנתאות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap');

  :root{
    --navy: #1B3357;
    --gold: #A9822F;
    --gray: #6E6F71;
    --bg-light: #EDF1F6;
    --paper: #FDFEFE;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    padding: 40px 16px;
    background: var(--bg-light);
    font-family: 'Heebo', sans-serif;
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card{
    max-width: 440px;
    width: 100%;
    background: var(--paper);
    border: 3px solid var(--navy);
    border-radius: 6px;
    padding: 40px 34px;
    text-align: center;
  }

  h1{
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--navy);
    line-height: 1.4;
  }

  .divider{
    width: 60px;
    height: 3px;
    background: var(--gold);
    margin: 0 auto 18px;
  }

  p{
    font-size: 15px;
    line-height: 1.7;
    color: var(--gray);
    margin: 0 0 26px;
  }

  label{
    display: block;
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 6px;
  }

  input[type="text"], input[type="tel"]{
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    font-family: inherit;
    border: 1.5px solid #CBD5E0;
    border-radius: 6px;
    margin-bottom: 20px;
    text-align: right;
    direction: rtl;
  }

  input:focus{
    outline: none;
    border-color: var(--gold);
  }

  button{
    width: 100%;
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  button:hover{
    opacity: 0.92;
  }

  button:disabled{
    opacity: 0.6;
    cursor: default;
  }

  .signature{
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--bg-light);
  }

  .signature .name{
    font-weight: 700;
    font-size: 15px;
    color: var(--navy);
  }

  .signature .role{
    color: var(--gray);
    font-size: 12px;
  }

  .signature .phone{
    color: var(--gold);
    font-weight: 700;
    font-size: 14px;
    margin-top: 4px;
  }

  .note{
    font-size: 11px;
    color: var(--gray);
    margin-top: 14px;
  }

  .status{
    font-size: 14px;
    font-weight: 600;
    margin-top: 14px;
    display: none;
  }

  .status.success{
    color: #1B7A43;
    display: block;
  }

  .status.error{
    color: #B3261E;
    display: block;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>מתעניינים במשכנתא חדשה?<br>ופוחדים ללכת לבד לבנק?</h1>
    <div class="divider"></div>
    <p>השאירו פרטים ונחזור אליכם להסבר ופרטים נוספים - בלי התחייבות.</p>

    <form id="leadForm">
      <input type="hidden" name="access_key" value="93d58a35-efaa-463b-8f11-3d9ef8ea287e">
      <input type="hidden" name="subject" value="פנייה חדשה - מתעניין במשכנתא">
      <input type="hidden" name="from_name" value="טופס השארת פרטים - אתר יצחק חלימי">

      <label for="name">שם מלא</label>
      <input type="text" id="name" name="name" placeholder="השם שלכם" required>

      <label for="phone">טלפון</label>
      <input type="tel" id="phone" name="phone" placeholder="050-0000000" required>

      <button type="submit" id="submitBtn">השאירו פרטים</button>
      <div class="status" id="statusMsg"></div>
    </form>

    <div class="signature">
      <div class="name">יצחק חלימי</div>
      <div class="role">יועץ משכנתאות</div>
      <div class="phone">055-673-6925</div>
    </div>

    <div class="note">הפרטים שלכם יישלחו אלינו באופן מאובטח ולא יפורסמו.</div>
  </div>

  <script>
    const form = document.getElementById('leadForm');
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('statusMsg');

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'שולח...';
      status.className = 'status';
      status.textContent = '';

      const formData = new FormData(form);

      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: formData
        });
        const result = await response.json();

        if (result.success) {
          status.className = 'status success';
          status.textContent = 'תודה! קיבלנו את הפרטים ונחזור אליכם בהקדם.';
          form.reset();
        } else {
          status.className = 'status error';
          status.textContent = 'משהו השתבש. נסו שוב או צרו קשר טלפונית.';
        }
      } catch (err) {
        status.className = 'status error';
        status.textContent = 'משהו השתבש. נסו שוב או צרו קשר טלפונית.';
      }

      btn.disabled = false;
      btn.textContent = 'השאירו פרטים';
    });
  </script>
</body>
</html>
